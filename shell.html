<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Housekeeper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08060f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #aaa;
  }

  /* SDL2 (Emscripten) sizes a RESIZABLE window from the canvas's CSS
     size, so the wrapper MUST have a real size: 900x650 native, shrinking
     with the viewport while keeping the aspect ratio. */
  #game-wrap {
    position: relative;
    width: min(900px, 100vw);
    aspect-ratio: 900 / 650;
    line-height: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: default;
    outline: none;
  }

  /* Fullscreen: fill the screen; the game letterboxes internally
     via SDL_RenderSetLogicalSize. */
  :fullscreen #game-wrap,
  :-webkit-full-screen #game-wrap {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
  }

  #controls {
    margin-top: 10px;
    font-size: 11px;
    color: #555;
    text-align: center;
    line-height: 1.7;
  }

  #fs-btn {
    margin-top: 8px;
    background: #1a1630;
    color: #887;
    border: 1px solid #332;
    padding: 4px 14px;
    font-family: monospace;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  #fs-btn:hover { background: #241e40; color: #bb9; }

  /* on-screen controls, shown only on touch devices */
  #touch {
    display: none;
    width: min(900px, 100vw);
    margin-top: 10px;
    gap: 8px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body.touch #touch { display: flex; }
  body.touch #controls { display: none; }
  #touch button {
    flex: 1;
    height: 64px;
    background: #1a1630;
    color: #ccb;
    border: 1px solid #443;
    border-radius: 6px;
    font-family: monospace;
    font-size: 20px;
    touch-action: none;
  }
  #touch button:active, #touch button.down { background: #3a3060; }
  #touch .fire { flex: 1.6; color: #ffe060; }

  /* spinner shown while wasm loads */
  #spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08060f;
    color: #6655aa;
    font-size: 14px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" tabindex="0" oncontextmenu="return false;"></canvas>
  <div id="spinner">LOADING…</div>
</div>

<div id="controls">
  ← → / A D &nbsp; move &nbsp;|&nbsp; SPACE &nbsp; shoot &nbsp;|&nbsp;
  hold ↓ / S &nbsp; mop a stain &nbsp;|&nbsp; P &nbsp; pause &nbsp;|&nbsp;
  M &nbsp; mute &nbsp;|&nbsp; F &nbsp; fullscreen &nbsp;|&nbsp; ESC &nbsp; menu<br>
  1 2 3 4 / ↑ ↓ &nbsp; select difficulty &nbsp;|&nbsp; gamepad supported
</div>
<div id="touch">
  <button data-key="ArrowLeft"  data-code="37">◀</button>
  <button data-key="ArrowDown"  data-code="40">MOP</button>
  <button data-key=" "          data-code="32" class="fire">FIRE</button>
  <button data-key="Enter"      data-code="13">↵</button>
  <button data-key="ArrowRight" data-code="39">▶</button>
</div>
<button id="fs-btn" onclick="toggleFS()">⛶ Fullscreen</button>

<script>
  // ── touch controls: synthesise key events for SDL ───────────
  if (window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
    document.body.classList.add('touch');
  }
  function sendKey(type, key, code) {
    var ev = new KeyboardEvent(type, {
      key: key, code: code === 32 ? 'Space' : (code === 13 ? 'Enter' : key),
      keyCode: code, which: code, bubbles: true, cancelable: true
    });
    window.dispatchEvent(ev);
  }
  document.querySelectorAll('#touch button').forEach(function (b) {
    var key = b.dataset.key, code = parseInt(b.dataset.code, 10), held = false;
    var dn = function (e) { e.preventDefault(); if (held) return; held = true;
                            b.classList.add('down'); sendKey('keydown', key, code); };
    var up = function (e) { if (e) e.preventDefault(); if (!held) return; held = false;
                            b.classList.remove('down'); sendKey('keyup', key, code); };
    b.addEventListener('pointerdown',   dn);
    b.addEventListener('pointerup',     up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave',  up);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
</script>

<script>
  // ── prevent browser scrolling on game keys ──────────────────
  window.addEventListener('keydown', function(e) {
    var blocked = [32,37,38,39,40];   // Space, Left, Up, Right, Down
    if (blocked.indexOf(e.keyCode) !== -1) e.preventDefault();
  }, { passive: false });

  // ── focus canvas on click anywhere on the page ───────────────
  var canvas = document.getElementById('canvas');
  document.addEventListener('click', function() { canvas.focus(); });
  // also focus as soon as the page loads
  window.addEventListener('load', function() { canvas.focus(); });

  // ── fullscreen toggle ────────────────────────────────────────
  function toggleFS() {
    var wrap = document.getElementById('game-wrap');
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }

  // ── Emscripten Module config ─────────────────────────────────
  var Module = {
    canvas: canvas,

    onRuntimeInitialized: function() {
      document.getElementById('spinner').style.display = 'none';
      canvas.focus();
    },

    // surface any load errors
    print:    function(t) { console.log(t); },
    printErr: function(t) { console.warn(t); },
  };
</script>

{{{ SCRIPT }}}

</body>
</html>
